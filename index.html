<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fidget Oyunu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="app-inner">
      <header>
        <h1>Fidget Oyunu</h1>
        <p class="subtitle">Stresini at, eğlen!</p>
      </header>

      <nav class="tabs">
        <button class="tab active" data-tab="spinner">Spinner</button>
        <button class="tab" data-tab="bubble">Bubble</button>
        <button class="tab" data-tab="stress">Stres</button>
        <button class="tab" data-tab="clicker">Clicker</button>
      </nav>

      <!-- Spinner Tab -->
      <section id="spinner" class="panel active">
        <div class="spinner-container">
          <!-- Gerçek fidget spinner fotoğrafı -->
          <div class="spinner" id="spinnerEl">
            <img src="https://pngimg.com/uploads/spinner/spinner_PNG99779.png"
                 alt="Fidget Spinner"
                 class="spinner-img"
                 draggable="false" />
          </div>
        </div>
        <div class="spinner-controls">
          <p class="hint">Spinner'a tıkla veya sürükle!</p>
          <div class="speed-display">
            Hız: <span id="speedDisplay">0</span> rpm
          </div>
        </div>
      </section>

      <!-- Bubble Wrap Tab -->
      <section id="bubble" class="panel">
        <div class="bubble-grid" id="bubbleGrid"></div>
        <div class="bubble-controls">
          <span class="popped-count">Patlatılan: <span id="poppedCount">0</span></span>
          <button class="btn" id="resetBubbles">Yenile</button>
        </div>
      </section>

      <!-- Stress Ball Tab -->
      <section id="stress" class="panel">
        <div class="stress-container">
          <div class="stress-ball" id="stressBall">
            <!-- SVG Stress Ball: gerçekçi kauçuk top -->
            <svg viewBox="0 0 180 180" width="180" height="180" xmlns="http://www.w3.org/2000/svg" class="stress-svg">
              <defs>
                <!-- Ana kauçuk yüzey -->
                <radialGradient id="ballMain" cx="36%" cy="30%" r="65%">
                  <stop offset="0%"   stop-color="#ff9060"/>
                  <stop offset="25%"  stop-color="#e85c28"/>
                  <stop offset="55%"  stop-color="#c43c10"/>
                  <stop offset="80%"  stop-color="#a02808"/>
                  <stop offset="100%" stop-color="#701800"/>
                </radialGradient>
                <!-- Alt-kenar subsurface scattering gölgesi -->
                <radialGradient id="ballShadow" cx="60%" cy="78%" r="50%">
                  <stop offset="0%"   stop-color="rgba(60,10,0,0.55)"/>
                  <stop offset="100%" stop-color="rgba(60,10,0,0)"/>
                </radialGradient>
                <!-- Üst specular highlight -->
                <radialGradient id="ballSpec" cx="32%" cy="26%" r="40%">
                  <stop offset="0%"   stop-color="rgba(255,255,255,0.70)"/>
                  <stop offset="40%"  stop-color="rgba(255,255,255,0.18)"/>
                  <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                </radialGradient>
                <!-- Küçük sert parlama noktası -->
                <radialGradient id="ballGlint" cx="50%" cy="50%" r="50%">
                  <stop offset="0%"   stop-color="rgba(255,255,255,0.90)"/>
                  <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                </radialGradient>
                <!-- Gölge filtresi -->
                <filter id="ballDrop">
                  <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="rgba(0,0,0,0.55)"/>
                </filter>
              </defs>

              <!-- Top gövdesi -->
              <circle cx="90" cy="90" r="82" fill="url(#ballMain)" filter="url(#ballDrop)"/>
              <!-- Alt-kenar gölge (derinlik) -->
              <circle cx="90" cy="90" r="82" fill="url(#ballShadow)"/>
              <!-- Büyük yumuşak highlight -->
              <ellipse cx="70" cy="64" rx="40" ry="32" fill="url(#ballSpec)"/>
              <!-- Küçük sert glint -->
              <ellipse cx="62" cy="54" rx="12" ry="9" fill="url(#ballGlint)"/>
              <!-- İnce kenar halkası (derinlik için) -->
              <circle cx="90" cy="90" r="81" fill="none"
                      stroke="rgba(0,0,0,0.18)" stroke-width="2"/>
            </svg>
            <span class="stress-face" id="stressFace">😐</span>
          </div>
          <p class="hint">Tıkla veya basılı tut!</p>
          <div class="squeeze-bar">
            <div class="squeeze-fill" id="squeezeFill"></div>
          </div>
          <p class="squeeze-label">Sıkıştırma gücü</p>
        </div>
      </section>

      <!-- Clicker Tab -->
      <section id="clicker" class="panel">
        <div class="clicker-container">
          <div class="button-bezel">
            <!-- SVG arcade button + chrome ring -->
            <svg viewBox="0 0 240 240" width="240" height="240" class="bezel-svg" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <!-- Chrome dış halka -->
                <linearGradient id="chromeRing" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%"   stop-color="#f8f8fc"/>
                  <stop offset="18%"  stop-color="#d0d0d8"/>
                  <stop offset="35%"  stop-color="#f4f4f8"/>
                  <stop offset="52%"  stop-color="#a0a0a8"/>
                  <stop offset="68%"  stop-color="#c8c8d0"/>
                  <stop offset="85%"  stop-color="#e8e8f0"/>
                  <stop offset="100%" stop-color="#b0b0b8"/>
                </linearGradient>
                <filter id="ringGlow">
                  <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.6)"/>
                </filter>
              </defs>
              <!-- Chrome halka -->
              <circle cx="120" cy="120" r="118" fill="url(#chromeRing)"
                      filter="url(#ringGlow)"
                      stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
              <!-- İç gölge çukuru -->
              <circle cx="120" cy="120" r="104" fill="rgba(0,0,0,0.4)"/>
            </svg>

            <!-- Asıl buton -->
            <div class="big-button" id="clickerBtn">
              <div class="button-dome">
                <span class="click-count" id="clickCount">0</span>
                <span class="click-label">TIKLA!</span>
              </div>
            </div>
          </div>

          <div class="clicker-stats">
            <div class="stat">
              <span class="stat-value" id="totalClicks">0</span>
              <span class="stat-label">Toplam</span>
            </div>
            <div class="stat">
              <span class="stat-value" id="cps">0</span>
              <span class="stat-label">Tık/sn</span>
            </div>
            <div class="stat">
              <span class="stat-value" id="bestCps">0</span>
              <span class="stat-label">En iyi</span>
            </div>
          </div>
          <button class="btn" id="resetClicker">Sıfırla</button>
        </div>
      </section>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
